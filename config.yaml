baseURL: https://hsandid.github.io
languageCode: en-us
defaultContentLanguage: en
title: "Hadi Sandid"

# Use Hugo modules to add theme
module:
  imports:
   - path: github.com/hugo-toha/toha/v4

# theme: "toha"
# Manage languages
# For any more details, you can check the official documentation: https://gohugo.io/content-management/multilingual/
languages:
  en:
    languageName: English
    weight: 1

# Force a locale to be use, really useful to develop the application ! Should be commented in production, the "weight" should rocks.
# DefaultContentLanguage: fr

# Allow raw html in markdown file
markup:
  goldmark:
    renderer:
      unsafe: true
  tableOfContents:
    startLevel: 1
    endLevel: 6
    ordered: false

# Enable global emoji support
enableEmoji: true

# Site parameters
params:
  footer:
    enable: true
    contactMe:
      enable: false
    navigation:
      enable: false
    newsletter:
      enable: false
      
  # Background image of the landing page
  background: /images/site/background.png

  # Provide logos for your site. The inverted logo will be used in the initial
  # transparent navbar and the main logo will be used in the non-transparent navbar.
  # It will default to the theme logos if not provided.
  logo:
    main: /images/site/main-logo.png
    inverted: /images/site/main-logo.png
    favicon: /images/site/main-logo.png

  # GitHub repo URL of your site
  gitRepo: https://github.com/hsandid/hsandid.github.io
  gitBranch: main


  features:
    darkMode:
      enable: true
    toc:
      enable: true
  # Enable and configure blog posts
    blog:
      enable: true
      showAuthor: false
    analytics:
      enable: true
      services:
        # GoatCounter
        goatCounter:
          code: halsandi
